<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste Plano de Inverno</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>body{font:15px Segoe UI,Arial,sans-serif;background:#071422;color:#eff7ff;margin:0}.w{max-width:1100px;margin:35px auto;padding:0 20px}.c{background:#102235;border:1px solid #294158;border-radius:14px;padding:18px;margin:14px 0}.ok{color:#34d399}.bad{color:#fb7185}.k{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.v{font-size:30px;font-weight:750}select{background:#15314a;color:#fff;border:1px solid #35536b;padding:8px;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #294158;text-align:left}@media(max-width:700px){.k{grid-template-columns:1fr}}</style></head><body><main class="w"><h1>❄ Plano de Inverno · teste GitHub</h1><p id="status">A carregar automaticamente o Excel…</p><section class="c"><label>Semana <select id="week"></select></label></section><section class="k"><div class="c"><div>Admissões SU</div><div id="ad" class="v">—</div></div><div class="c"><div>Registos lidos</div><div id="rows" class="v">—</div></div><div class="c"><div>ULS distintas</div><div id="uls" class="v">—</div></div></section><section class="c"><b>Admissões por ULS</b><table><thead><tr><th>ULS</th><th>Admissões</th></tr></thead><tbody id="tb"></tbody></table></section><section class="c"><b>Diagnóstico</b><pre id="diag"></pre></section></main><script>
const FILE='./SIMSNS_3_su_admissoes_tipologia.xlsx?ts='+Date.now();let data=[];const num=v=>Number(String(v??0).replace(',','.'))||0, nf=new Intl.NumberFormat('pt-PT');
async function load(){try{status.textContent='A descarregar SIMSNS_3_su_admissoes_tipologia.xlsx…';let r=await fetch(FILE,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status+' '+r.statusText);let b=await r.arrayBuffer();let wb=XLSX.read(b,{type:'array',cellDates:true});let sn=wb.SheetNames.find(x=>!/^instru|ficha|refer/i.test(x))||wb.SheetNames[0];data=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:null,raw:true});rows.textContent=nf.format(data.length);let us=new Set(data.map(r=>r.ULS).filter(Boolean));uls.textContent=nf.format(us.size);let weeks=[...new Set(data.map(r=>r.COD_SEMANA_ANO).filter(Boolean).map(String))].sort((a,b)=>b.localeCompare(a));week.innerHTML=weeks.map(x=>`<option>${x}</option>`).join('');week.onchange=render;status.className='ok';status.textContent='✓ Excel carregado automaticamente do GitHub';diag.textContent='Ficheiro: '+FILE.split('?')[0]+'\nFolha: '+sn+'\nBytes: '+b.byteLength.toLocaleString('pt-PT')+'\nLinhas: '+data.length.toLocaleString('pt-PT');render()}catch(e){status.className='bad';status.textContent='✕ '+e.message;diag.textContent=e.stack+'\n\nConfirma que index.html e o Excel estão na raiz do mesmo repositório e que GitHub Pages está ativo.'}}
function render(){let w=week.value,a=data.filter(r=>String(r.COD_SEMANA_ANO)===w),total=a.reduce((s,r)=>s+num(r.QTD_ADMISSOES_SU),0);ad.textContent=nf.format(total);let m={};a.forEach(r=>{let u=r.ULS||'Sem ULS';m[u]=(m[u]||0)+num(r.QTD_ADMISSOES_SU)});tb.innerHTML=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20).map(([u,v])=>`<tr><td>${u}</td><td>${nf.format(v)}</td></tr>`).join('')}
load();</script></body></html>
